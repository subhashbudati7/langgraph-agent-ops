[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-agent-ops"
version = "0.1.0"
description = "Multi-agent workflow ops: supervisor routing, retry/backoff, cost caps, guardrails, and tracing on LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Subhash", email = "47440567+subhashbudati7@users.noreply.github.com" }]
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["agent_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
